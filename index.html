<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OSE Teknoloji | Proforma & Teklif Sistemi</title>
    <meta name="description" content="OSE Teknoloji teklif, proforma ve müşteri yönetim sistemi" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OSE Proforma" />
    <link rel="preload" href="/fonts/Inter-400Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter-700Bold.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ose-theme') || 'dark';
          if (t === 'system') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.className = t;
          document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f4f6fa' : '#0f1116');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
